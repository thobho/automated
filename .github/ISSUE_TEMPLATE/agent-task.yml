name: Agent task
description: Queue work for the autonomous Claude worker
title: ""
labels: ["agent:todo"]
body:
  - type: input
    id: project
    attributes:
      label: Project
      description: Folder name under projects/ (new name = new project). Also add the matching project:<name> label if it exists.
      placeholder: weather-bot
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What to build
      description: The task, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How the agent knows it's finished (tests pass, command works, page shows X...).
      placeholder: "- `python main.py` prints today's forecast"
