{% load i18n catalog_tags %}
<nav class="catalog-pagination" aria-label="{% translate 'Strony katalogu' %}">
  {% if page.previous %}
    <a href="{% page_url filters page.previous %}" rel="prev">{% translate "Poprzednia" %}</a>
  {% endif %}
  {% for number in page.numbers %}
    {% if number == page.number %}
      <span aria-current="page">{{ number }}</span>
    {% else %}
      <a href="{% page_url filters number %}">{{ number }}</a>
    {% endif %}
  {% endfor %}
  {% if page.next %}
    <a href="{% page_url filters page.next %}" rel="next">{% translate "Następna" %}</a>
  {% endif %}
</nav>
