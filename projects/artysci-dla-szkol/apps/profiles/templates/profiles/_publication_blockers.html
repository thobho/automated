{% load i18n %}
<p>{% translate "Żeby opublikować stronę, uzupełnij:" %}</p>
<ul class="publication-blockers">
  {% for blocker in blockers %}
    <li data-blocker="{{ blocker.key }}">
      {{ blocker.text }}
      <a class="button" href="{% url blocker.url_name %}">{% translate "Uzupełnij" %}</a>
    </li>
  {% endfor %}
</ul>
