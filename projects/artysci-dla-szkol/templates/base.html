{% load static i18n %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% translate "Artyści dla szkół" %}{% endblock %}</title>
  {# Strict CSP: HTMX must not eval, run swapped-in scripts or inject its indicator <style>. #}
  <meta name="htmx-config" content='{"allowEval": false, "allowScriptTags": false, "includeIndicatorStyles": false}'>
  {% block head %}{% endblock %}
  {# HTMX is vendored (D11): never load it from a CDN. #}
  <script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
</head>
{# Send the CSRF token with every HTMX request. #}
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header>
    <nav aria-label="{% translate 'Konto' %}">
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:settings' %}">{% translate "Ustawienia konta" %}</a>
        {# Logout is POST-only (CSRF-protected); the server ends the session. #}
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit">{% translate "Wyloguj" %}</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">{% translate "Zaloguj" %}</a>
      {% endif %}
    </nav>
  </header>
  <main id="main">
    {% if messages %}
      <div role="status">
        <ul>{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>
    <nav aria-label="{% translate 'Dokumenty prawne' %}">
      <a href="{% url 'trust:terms' %}">{% translate "Regulamin" %}</a>
      <a href="{% url 'trust:privacy' %}">{% translate "Polityka prywatności" %}</a>
      <a href="{% url 'trust:cookies' %}">{% translate "Informacja o ciasteczkach" %}</a>
    </nav>
  </footer>
</body>
</html>
