<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chart Template</title>
  <meta name="description" content="Template for creating new charts">
  
  <!-- Preload fonts for performance -->
  <link rel="preload" href="../vendor/design/fonts/public-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../vendor/design/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  
  <!-- Design system styles -->
  <link rel="stylesheet" href="../vendor/design/tokens.css">
  <link rel="stylesheet" href="../vendor/design/components.css">
  <link rel="stylesheet" href="../css/site.css">
  
  <!-- Page-specific styles -->
  <style>
    /* Add any page-specific styles here */
  </style>
</head>
<body>
  <!-- Top bar included from shell.js -->
  
  <main id="main" class="site-main">
    <div class="container">
      <!-- Page header -->
      <div class="page-head">
        <h1>Chart Title</h1>
        <p class="lede">Brief description of what this chart shows</p>
      </div>
      
      <!-- Chart container -->
      <div class="grid" id="figures">
        <!-- Charts will be inserted here by JavaScript -->
      </div>
    </div>
  </main>
  
  <!-- Scripts -->
  <script src="../js/shell.js"></script>
  <script src="../vendor/lib/echarts-6.1.0.min.js"></script>
  <script src="../vendor/lib/topojson-client-3.1.0.min.js"></script>
  <script src="../vendor/design/components.js"></script>
  <script src="../js/votw-core.js"></script>
  <script src="../js/votw-charts.js"></script>
  
  <!-- Chart specification -->
  <script>
    // Chart specification template
    const chartSpec = {
      id: "chart-id", 
      title: "Chart Title", 
      subtitle: "Chart type. What the chart shows, units, time period (data note)",
      source: window.Votw.DEMO_SOURCE, 
      
      // Data loading function
      async load() { 
        // Load data needed for the chart
        // Example: return await Votw.data.regions();
        return {}; 
      },
      
      // CSV export function
      csv(d, ctl) {
        // Return header and rows for CSV export
        return { 
          header: ["column1", "column2"], 
          rows: [] // Data rows
        };
      },
      
      // Chart rendering function
      build(d, ctl) {
        // Build and return the chart options
        // Use Votw helper functions for consistency
        return Votw.base({
          // Chart configuration
        });
      },
      
      // Optional: Custom height function
      height: (w) => (w < 600 ? 320 : 360)
    };
    
    // Mount the chart when page loads
    (function () {
      document.addEventListener('DOMContentLoaded', function() {
        Votw.figure(document.getElementById("figures"), chartSpec);
      });
    })();
  </script>
</body>
</html>
