<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Source Footer Template</title>
  <meta name="description" content="Template for proper source footers">
  
  <!-- Preload fonts for performance -->
  <link rel="preload" href="../vendor/design/fonts/public-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../vendor/design/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  
  <!-- Design system styles -->
  <link rel="stylesheet" href="../vendor/design/tokens.css">
  <link rel="stylesheet" href="../vendor/design/components.css">
  <link rel="stylesheet" href="../css/site.css">
</head>
<body>
  <!-- Top bar included from shell.js -->
  
  <main id="main" class="site-main">
    <div class="container">
      <!-- Page header -->
      <div class="page-head">
        <h1>Source Footer Template</h1>
        <p class="lede">Example showing proper source footer implementation</p>
      </div>
      
      <!-- Chart container -->
      <div class="grid" id="figures"></div>
    </div>
  </main>
  
  <!-- Scripts -->
  <script src="../js/shell.js"></script>
  <script src="../vendor/lib/echarts-6.1.0.min.js"></script>
  <script src="../vendor/lib/topojson-client-3.1.0.min.js"></script>
  <script src="../vendor/design/components.js"></script>
  <script src="../js/votw-core.js"></script>
  <script src="../js/votw-charts.js"></script>
  
  <!-- Source footer specification -->
  <script>
    // Source footer specification
    const sourceFooterSpec = {
      id: "source-footer-example", 
      title: "Chart with Proper Source", 
      subtitle: "Example showing correct source footer implementation (synthetic data)",
      
      // IMPORTANT: Every chart MUST have a source object
      source: { 
        label: "Synthetic demo data (made up, not GUS)", 
        url: "data/demo.json", 
        meta: "generated by scripts/make_demo_data.py",
        accessed: "2026-10-29"
      }, 
      
      // Data loading function
      async load() { 
        return await Votw.data.regions();
      },
      
      // CSV export function
      csv(d) {
        return { 
          header: ["component", "value"], 
          rows: [["A", Math.random() * 100], ["B", Math.random() * 100], ["C", Math.random() * 100]]
        };
      },
      
      // Chart rendering function
      build(d) {
        // Sample data
        const components = ["Component A", "Component B", "Component C"];
        const values = components.map(() => Math.random() * 100);
        
        return Votw.base({
          legend: Votw.legend({ show: false }),
          grid: Votw.grid(),
          tooltip: Votw.tooltip({ 
            formatter: (params) => {
              return Votw.tipRows(params.name, [{
                color: params.color, 
                label: "Value", 
                value: Votw.fmt(params.value, 1)
              }]);
            },
            axisPointer: { type: "shadow" }
          }),
          xAxis: Votw.catAxis(components, {
            axisLabel: Object.assign(Votw.textStyle(), { 
              interval: 0,
              rotate: window.innerWidth < 600 ? 45 : 0
            })
          }),
          yAxis: Votw.valueAxis(),
          series: [{
            name: "Components",
            type: "bar",
            barMaxWidth: 56,
            data: values,
            itemStyle: { 
              color: Votw.cssVar("--data-cat-1"),
              borderRadius: [4, 4, 0, 0]
            },
            emphasis: { focus: "series" }
          }]
        });
      },
      
      // Height function
      height: (w) => (w < 600 ? 360 : 340)
    };
    
    // Mount the chart when page loads
    (function () {
      document.addEventListener('DOMContentLoaded', function() {
        Votw.figure(document.getElementById("figures"), sourceFooterSpec);
      });
    })();
  </script>
</body>
</html>
